[package]
name = "video"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ec = "^0.5.0"
ark-ff = { version = "^0.5.0", default-features = false }
ark-poly = "^0.5.0"
ark-std = { version = "^0.5.0" }
ark-crypto-primitives = { version = "^0.5.0", default-features = false, features = ["r1cs", "sponge", "crh"] }
ark-relations = { version = "^0.5.0", default-features = false }
ark-r1cs-std = { version = "^0.5.0", default-features = false } # this is patched at the workspace level
ark-snark = { version = "^0.5.0"}
ark-serialize = "^0.5.0"
rayon = "1.7.0"
num-bigint = "^0.4.6"
ndarray = "0.15.6"
folding-schemes = { path = "../folding-schemes/", default-features = false }
ark-pallas = {version="^0.5.0", features=["r1cs"]}
ark-vesta = {version="^0.5.0", features=["r1cs"]}
ark-bn254 = {version="^0.5.0", features=["r1cs"]}
ark-grumpkin = {version="^0.5.0", features=["r1cs"]}
ark-groth16 = { version = "^0.5.0" }
sha3 = "0.10.8"
num-modular = "0.6.1"
num-traits = "0.2.19"
tracing = { version = "0.1", default-features = false, features = [ "attributes" ] }
tracing-subscriber = { version = "0.2" }

# Transparent Spartan decider (optional; on by default).
spartan2 = { path = "../third_party/spartan2", optional = true }
ff = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rand = "0.8.5"

[features]
default = ["parallel", "cpu", "asm", "spartan"]
constraints = []
cuda = ["folding-schemes/cuda"]
cpu = ["parallel", "folding-schemes/cpu"]
asm = ["ark-ff/asm", "folding-schemes/asm"]
spartan = ["dep:spartan2", "dep:ff", "dep:serde"]

parallel = [ 
    "ark-std/parallel", 
    "ark-ff/parallel",  
    "ark-ec/parallel",  
    "ark-poly/parallel", 
    "ark-crypto-primitives/parallel",  
    "ark-r1cs-std/parallel", 
    "folding-schemes/parallel",
    # "ark-relations/parallel",
]
