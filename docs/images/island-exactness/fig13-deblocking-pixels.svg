<text x="66" y="406" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0">Why the filter skips that border</text>
<text x="66" y="434" font-size="12.8" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">Filter strength is set by the average quality number of the two blocks. The standard fixes a raw block’s number at 0.</text>
<text x="66" y="458" font-size="12.8" fill="#e2e8f5" text-anchor="start" font-weight="400" opacity="1.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">average of 0 and 28  =  14      →      at 14 both filter thresholds are 0      →      the decoder filters nothing across that border</text>
<text x="66" y="486" font-size="12.8" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">It is skipped on all four borders of the raw block, and on every border inside it.</text>
<text x="40" y="566" font-size="15" fill="#e2e8f5" text-anchor="start" font-weight="600" opacity="1.0">How big is the whole effect, measured over the frame</text>
<text x="40" y="600" font-size="22" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">54</text>
<text x="40" y="622" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">macroblocks touched by the ring,</text>
<text x="40" y="639" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">out of 3,600</text>
<text x="325" y="600" font-size="22" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">349</text>
<text x="325" y="622" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">luma samples differ, out of 13,824</text>
<text x="325" y="639" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">in those blocks (2.5%)</text>
<text x="610" y="600" font-size="22" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text>
<text x="610" y="622" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">largest difference, on a 0–255</text>
