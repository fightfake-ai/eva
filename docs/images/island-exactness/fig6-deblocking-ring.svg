<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1180" height="430" fill="#070b14"/>
<text x="40" y="46" font-size="20" fill="#e2e8f5" text-anchor="start" font-weight="600" opacity="1.0">The smoothing filter is what stops exactness</text>
<text x="40" y="72" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">A decoder smooths across every block border. Inside a raw block it is skipped, and it is skipped on that block’s borders too.</text>
<rect x="26" y="116" width="520" height="210" rx="10" fill="#0d1424" stroke="#1b2540" stroke-width="1"/>
<text x="40" y="140" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0">Camera file: two ordinary blocks</text>
<rect x="40" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="66" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="92" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="118" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="144" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="170" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="196" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="222" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<line x1="144" y1="160" x2="144" y2="226" stroke="#e2e8f5" stroke-width="2.2"/>
<text x="144" y="244" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">block border</text>
<rect x="66" y="166" width="156" height="52" fill="#22d3ee" opacity="0.16"/>
<text x="232.39999999999998" y="190" font-size="12" fill="#22d3ee" text-anchor="start" font-weight="400" opacity="1.0">smoothed</text>
<text x="40" y="276" font-size="12.5" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">This smoothing is part of the signed picture.</text>
<rect x="606" y="116" width="520" height="210" rx="10" fill="#0d1424" stroke="#1b2540" stroke-width="1"/>
<text x="620" y="140" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="600" opacity="1.0">Published file: raw block on the left</text>
<rect x="620" y="166" width="26" height="52" fill="#a855f7" stroke="#1b2540" stroke-width="1"/>
<rect x="646" y="166" width="26" height="52" fill="#a855f7" stroke="#1b2540" stroke-width="1"/>
<rect x="672" y="166" width="26" height="52" fill="#a855f7" stroke="#1b2540" stroke-width="1"/>
<rect x="698" y="166" width="26" height="52" fill="#a855f7" stroke="#1b2540" stroke-width="1"/>
<rect x="724" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="750" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="776" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<rect x="802" y="166" width="26" height="52" fill="#1d2a47" stroke="#1b2540" stroke-width="1"/>
<line x1="724" y1="160" x2="724" y2="226" stroke="#e2e8f5" stroke-width="2.2"/>
<text x="724" y="244" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">block border</text>
<text x="812.4" y="190" font-size="12" fill="#ef4444" text-anchor="start" font-weight="400" opacity="1.0">not smoothed</text>
<text x="620" y="276" font-size="12.5" fill="#ef4444" text-anchor="start" font-weight="400" opacity="1.0">The neighbour keeps a 2-pixel strip the camera smoothed: off by up to 3 of 255.</text>
<text x="40" y="402" font-size="13" fill="#e2e8f5" text-anchor="start" font-weight="400" opacity="1.0">Making that neighbour raw as well just moves the border outward, and a new ring appears. Measured: 636 → 149 → 215 → 103 → 106 → 92 blocks over six rounds, never zero.</text>
</svg>